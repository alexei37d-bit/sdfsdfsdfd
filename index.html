<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баланс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 22px; margin-bottom: 15px; text-align: center; }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        }
        .row:last-child { border-bottom: none; }
        .name { font-weight: 500; opacity: 0.8; }
        .val { font-weight: bold; font-family: monospace; }
        .total { text-align: center; margin-top: 10px; font-size: 14px; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>💰 Ваш Баланс</h1>
    <div id="app">
        <div class="card" id="list"></div>
        <div class="total" id="total"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получаем данные из URL (параметр ?data=...)
        const params = new URLSearchParams(window.location.search);
        const dataStr = params.get('data');

        if (dataStr) {
            try {
                const data = JSON.parse(decodeURIComponent(dataStr));
                const list = document.getElementById('list');
                let html = '';
                
                for (const [curr, amount] of Object.entries(data.balances)) {
                    if (parseFloat(amount) > 0) {
                        html += `<div class="row"><span class="name">${curr}</span><span class="val">${amount}</span></div>`;
                    }
                }
                
                if (html === '') html = '<div style="text-align:center; padding:10px;">Пусто</div>';
                
                list.innerHTML = html;
                document.getElementById('total').innerText = `≈ ${data.total_btc} BTC`;
            } catch (e) {
                document.getElementById('list').innerText = "Ошибка данных";
            }
        } else {
            document.getElementById('list').innerText = "Запустите через бота";
        }
    </script>
</body>
</html>
