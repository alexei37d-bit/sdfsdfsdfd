<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Баланс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        /* SVG Иконка */
        .wallet-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
        }
        h1 { font-size: 22px; margin: 0; text-align: center; }
        
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        }
        .row:last-child { border-bottom: none; }
        .name { font-weight: 500; opacity: 0.8; display: flex; align-items: center; gap: 5px; }
        .val { font-weight: bold; font-family: monospace; font-size: 1.1em; }
        .total { text-align: center; margin-top: 15px; font-size: 14px; opacity: 0.7; }
        
        .error-msg { color: #ff4b4b; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <!-- SVG Картинка Кошелька -->
        <svg class="wallet-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 7.28V5C21 3.89 20.1 3 19 3H5C3.89 3 3 3.89 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V16.72C21.59 16.37 22 15.74 22 15V9C22 8.26 21.59 7.63 21 7.28ZM20 9V15H13C11.9 15 11 15.9 11 17C11 18.1 11.9 19 13 19H20V19C20 19.55 19.55 20 19 20H5C4.45 20 4 19.55 4 19V5C4 4.45 4.45 4 5 4H19C19.55 4 20 4.45 20 5V7.28C19.41 7.63 19 8.26 19 9H13C11.9 9 11 9.9 11 11C11 12.1 11.9 13 13 13H20C20.55 13 21 12.55 21 12V9C21 8.45 20.55 8 20 8H13V10H20V12H13V14H20V15H13C12.45 15 12 14.55 12 14C12 13.45 12.45 13 13 13H20V9H13V11H20V13H13" fill="var(--tg-theme-link-color, #2481cc)"/>
            <circle cx="17" cy="11" r="1.5" fill="var(--tg-theme-bg-color, #fff)"/>
        </svg>
        <h1>Ваш Баланс</h1>
    </div>

    <div id="app" style="width: 100%; max-width: 400px;">
        <div class="card" id="list">
            <div style="text-align:center; padding: 20px;">Загрузка...</div>
        </div>
        <div class="total" id="total"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получаем данные из URL (параметр ?data=...)
        const params = new URLSearchParams(window.location.search);
        const dataStr = params.get('data');

        if (dataStr) {
            try {
                const data = JSON.parse(decodeURIComponent(dataStr));
                const list = document.getElementById('list');
                let html = '';
                
                // Сортировка валют (USDT, BTC и т.д.)
                const currencies = Object.keys(data.balances);
                
                if (currencies.length === 0) {
                    html = '<div style="text-align:center; padding:10px;">Баланс пуст</div>';
                } else {
                    for (const curr of currencies) {
                        const amount = data.balances[curr];
                        if (parseFloat(amount) > 0) {
                            html += `
                                <div class="row">
                                    <span class="name">${curr}</span>
                                    <span class="val">${amount}</span>
                                </div>`;
                        }
                    }
                }
                
                list.innerHTML = html;
                if (data.total_btc) {
                    document.getElementById('total').innerText = `≈ ${data.total_btc} BTC`;
                }
            } catch (e) {
                document.getElementById('list').innerHTML = '<div class="error-msg">Ошибка формата данных</div>';
                console.error(e);
            }
        } else {
            // Если открыли просто по ссылке без бота
            document.getElementById('list').innerHTML = '<div class="error-msg">Откройте это приложение через кнопку в боте</div>';
        }
    </script>
</body>
</html>
